name: Android Release (optional, signed)

# Manual only. Requires GitHub Secrets:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version 8.7 --no-daemon; fi
          chmod +x gradlew
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          VIBESYNC_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          VIBESYNC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VIBESYNC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VIBESYNC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: VibeSync-Music-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
