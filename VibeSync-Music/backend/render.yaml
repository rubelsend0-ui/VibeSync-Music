services:
  - type: web
    name: vibesync-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: VIBESYNC_PROVIDERS
        value: internet_archive,jamendo,youtube
      # Set these in the Render dashboard (never commit them):
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
